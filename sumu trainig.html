<!DOCTYPE html>
<html>
<head>
<title>Digital Clock</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: rgb(25, 2, 66);
    margin: 0;
  }
  #clock {
    font-family: monospace;
    font-size: 60px;
    color: #81ede9;
  }
</style>
</head>
<body>

<div id="clock"></div>

<script>
function showTime() {
  let now = new Date();
  let h = now.getHours();
  let m = now.getMinutes();
  let s = now.getSeconds();
  let ampm = h >= 12 ? "PM" : "AM";

  h = h % 12;
  h = h ? h : 12;

  h = h < 10 ? "0" + h : h;
  m = m < 10 ? "0" + m : m;
  s = s < 10 ? "0" + s : s;

  document.getElementById("clock").innerHTML = h + ":" + m + ":" + s + " " + ampm;
}

setInterval(showTime, 1000);
showTime();
</script>

</body>
</html>
