
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #c4b5fd);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            width: 320px;
            background: #ffffff;
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 18px;
        }

        #display {
            width: 100%;
            height: 65px;
            border: none;
            outline: none;
            background: #f1f5f9;
            border-radius: 10px;
            margin-bottom: 15px;
            padding: 12px;
            text-align: right;
            font-size: 28px;
            color: #0f172a;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background: #e2e8f0;
            color: #1e293b;
            transition: 0.2s;
        }

        button:hover {
            filter: brightness(0.94);
            transform: translateY(-2px);
        }

        .operator {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .clear {
            background: #fee2e2;
            color: #dc2626;
        }

        .equal {
            background: #2563eb;
            color: white;
        }

        .zero {
            grid-column: span 2;
        }

        .reset {
            grid-column: span 2;
            background: #fef3c7;
            color: #92400e;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <h2>Calculator</h2>

        <input
            type="text"
            id="display"
            value="0"
            readonly
            aria-label="Calculator display"
        >

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="reset" onclick="resetCalculator()">RESET</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendDecimal()">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        let firstNumber = null;
        let operator = null;
        let waitingForNumber = false;

        function appendNumber(number) {
            if (display.value === "Error") {
                resetCalculator();
            }

            if (waitingForNumber || display.value === "0") {
                display.value = number;
                waitingForNumber = false;
            } else {
                display.value += number;
            }
        }

        function appendDecimal() {
            if (display.value === "Error") {
                resetCalculator();
            }

            if (waitingForNumber) {
                display.value = "0.";
                waitingForNumber = false;
            } else if (!display.value.includes(".")) {
                display.value += ".";
            }
        }

        function chooseOperator(nextOperator) {
            if (display.value === "Error") return;

            const currentNumber = Number(display.value);

            if (operator && !waitingForNumber) {
                calculate();
                if (display.value === "Error") return;
            } else if (firstNumber === null) {
                firstNumber = currentNumber;
            }

            if (firstNumber === null) {
                firstNumber = Number(display.value);
            }

            operator = nextOperator;
            waitingForNumber = true;
        }

        function calculate() {
            if (operator === null || waitingForNumber) return;

            const secondNumber = Number(display.value);
            let result;

            switch (operator) {
                case "+":
                    result = firstNumber + secondNumber;
                    break;
                case "-":
                    result = firstNumber - secondNumber;
                    break;
                case "*":
                    result = firstNumber * secondNumber;
                    break;
                case "/":
                    if (secondNumber === 0) {
                        display.value = "Error";
                        firstNumber = null;
                        operator = null;
                        waitingForNumber = true;
                        return;
                    }
                    result = firstNumber / secondNumber;
                    break;
            }

            if (!Number.isFinite(result)) {
                display.value = "Error";
            } else {
                display.value = String(
                    Number(result.toPrecision(12))
                );
            }

            firstNumber = null;
            operator = null;
            waitingForNumber = true;
        }

        function clearDisplay() {
            display.value = "0";
            waitingForNumber = false;
        }

        function resetCalculator() {
            display.value = "0";
            firstNumber = null;
            operator = null;
            waitingForNumber = false;
        }
    </script>
</body>
</html>
